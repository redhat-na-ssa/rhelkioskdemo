# Build-only playbook. Compiles the kiosk or shell binary on the local
# controller without deploying anything. Pass -e deploy_target=kiosk or
# -e deploy_target=shell to select which binary to build.
---
- name: Pre-flight variable validation
  hosts: all
  connection: local
  gather_facts: false
  roles:
    - { role: preflight, run_once: true }

- name: Build demo binary on controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deploy_skip_build: false
    deploy_target: kiosk
  tasks:
    - name: Build gnome-kiosk binary
      community.general.make:
        chdir: "{{ playbook_dir }}/.."
      when:
        - not deploy_skip_build | bool
        - deploy_target == 'kiosk'

    - name: Build gnome-shell binary
      community.general.make:
        chdir: "{{ playbook_dir }}/.."
        target: shell
      when:
        - not deploy_skip_build | bool
        - deploy_target == 'shell'
